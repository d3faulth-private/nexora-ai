[project]
name = "nexora-ai"
version = "0.3.0"
description = "Nexora AI - AI workforce operating system for service businesses"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "bcrypt>=4.2,<5",
  "cryptography>=43,<46",
  "apscheduler>=3.10,<4",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
