[project]
name = "nexora-ai"
version = "0.5.0"
description = "Nexora AI - AI workforce operating system for service businesses"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "bcrypt>=4.2,<5",
  "cryptography>=43,<46",
  "apscheduler>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "prompt-toolkit>=3.0,<4",
  "alembic>=1.14,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "detect-secrets>=1.5,<2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[project.scripts]
nexora = "d3terminal.__main__:main"
d3terminal = "d3terminal.__main__:main"

[tool.setuptools.packages.find]
include = ["app*", "d3terminal*"]


[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/api/routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["app", "d3terminal"]
exclude = ["migrations"]

# Gradual adoption debt list. These modules stay behavior-tested while their
# typing debt is paid down incrementally; new modules must not join this list.
[[tool.mypy.overrides]]
module = [
  "app.agents",
  "app.automation",
  "app.db",
  "app.hvac",
  "app.inbox",
  "app.main",
  "app.models",
  "app.revenue",
  "app.seed",
  "app.services",
  "app.api.routes",
  "app.connectors.providers",
  "d3terminal.diagnostics",
  "d3terminal.runtime",
  "d3terminal.shell"
]
ignore_errors = true
