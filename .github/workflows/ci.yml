name: Nexora CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate pre-commit config
        run: pre-commit validate-config .pre-commit-config.yaml

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format gate
        run: >-
          python -m ruff format --check
          app/ai.py
          app/config.py
          app/policy.py
          app/schemas.py
          app/security.py
          app/vault.py
          d3terminal/branding.py
          d3terminal/theme.py

      - name: Type check
        run: python -m mypy

      - name: Test
        env:
          AUTOMATION_ENABLED: "false"
        run: python -m pytest

      - name: Migration check
        run: python scripts/migrate.py

      - name: Compile check
        run: python -m compileall -q app d3terminal migrations scripts

      - name: JavaScript syntax check
        run: node --check app/static/app.js

      - name: D3 terminal import check
        run: python -c "from d3terminal.shell import OperatorShell; assert OperatorShell()._normalize('what needs my attention') == 'opportunities'"
