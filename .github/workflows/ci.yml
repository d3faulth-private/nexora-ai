name: Nexora CI

on:
  push:
    branches: [main, v0.3, v0.4-commercial, v0.4-repair-abcd]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        env:
          AUTOMATION_ENABLED: "false"
        run: python -m pytest

      - name: Compile check
        run: python -m compileall -q app d3terminal

      - name: JavaScript syntax check
        run: node --check app/static/app.js

      - name: D3 terminal import check
        run: python -c "from d3terminal.shell import OperatorShell; assert OperatorShell()._normalize('what needs my attention') == 'opportunities'"
